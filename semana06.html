<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letreiro com React</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script
      src="https://unpkg.com/react@18/umd/react.development.js"
      crossorigin
    ></script>
    <script
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
      crossorigin
    ></script>
    <script
      src="https://unpkg.com/@babel/standalone/babel.min.js"
      crossorigin
    ></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        margin-top: 50px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      function Letreiro() {
        const [texto, setTexto] = React.useState('');
        const mensagem = "Venha estudar na Fatec";
        const [indice, setIndice] = React.useState(0);

        React.useEffect(() => {
          if (indice < mensagem.length) {
            const timer = setTimeout(() => {
              setTexto((prev) => prev + mensagem[indice]);
              setIndice(indice + 1);
            }, 150); // 150 milissegundos entre cada letra

            return () => clearTimeout(timer); // Limpa o timer quando o componente é desmontado ou o índice muda
          }
        }, [indice]); // Reexecuta o efeito sempre que o índice mudar

        return (
          <div>
            <h1>{texto}</h1>
          </div>
        );
      }

      // Renderiza o componente Letreiro no DOM
      ReactDOM.render(<Letreiro />, document.getElementById('root'));
    </script>
    
    <div class="text-center mt-5"> 
        <a href="index.html" class="btn btn-primary  btn-sm">Voltar</a>
    </div>



</body>
</html>
